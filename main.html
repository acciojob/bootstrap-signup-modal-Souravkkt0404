<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Modal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

    <!-- Trigger Button -->
    <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#signupModal">
        Sign Up
    </button>

    <!-- Signup Modal -->
    <div class="modal fade" id="signupModal" tabindex="-1" aria-labelledby="signupModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                
                <!-- Modal Header -->
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="signupModalLabel">Create Account</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <!-- Modal Body with Form -->
                <div class="modal-body">
                    <form id="signupForm">
                        
                        <!-- Email Input -->
                        <div class="mb-3">
                            <label for="emailInput" class="form-label fw-bold">Email address</label>
                            <input type="email" class="form-control" id="emailInput" placeholder="Enter email">
                            <div id="emailHelp" class="form-text text-muted">Your information is safe with us.</div>
                        </div>

                        <!-- Password Input -->
                        <div class="mb-3">
                            <label for="passwordInput" class="form-label fw-bold">Password</label>
                            <input type="password" class="form-control" id="passwordInput" placeholder="Password">
                        </div>

                        <!-- Confirm Password Input -->
                        <div class="mb-3">
                            <label for="confirmPasswordInput" class="form-label fw-bold">Confirm Password</label>
                            <input type="password" class="form-control" id="confirmPasswordInput" placeholder="Confirm Password">
                        </div>

                    </form>
                </div>

                <!-- Modal Footer -->
                <div class="modal-footer border-top-0">
                    <button type="submit" form="signupForm" class="btn btn-success">Submit</button>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
